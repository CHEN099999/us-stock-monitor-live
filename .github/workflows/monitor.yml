name: US Stock Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: us-stock-monitor-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt -q

      - name: Write sensitive config
        env:
          MONITOR_CONFIG: ${{ secrets.MONITOR_CONFIG }}
        run: |
          if [ -z "$MONITOR_CONFIG" ]; then
            echo "::error::MONITOR_CONFIG secret is not configured"
            exit 1
          fi
          printf '%s\n' "$MONITOR_CONFIG" > config.yaml

      - name: Run monitor
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
          LEDGER_KEY: ${{ secrets.LEDGER_KEY }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ -z "$STATE_KEY" ]; then
            echo "::error::STATE_KEY secret is not configured"
            exit 1
          fi
          python monitor.py

      - name: Commit state back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f alerted_state.json ]; then
            echo "No state file"
            exit 0
          fi
          git add alerted_state.json alerted_ledger.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: update monitor state $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase --autostash origin main
            git push
          else
            echo "No state changes"
          fi
